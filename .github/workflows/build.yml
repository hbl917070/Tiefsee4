name: Build Tiefsee

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    # NativeHost uses the VS 2022 v143 toolset; avoid windows-latest moving to VS 2026.
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Spinning up Node.js
        id: node-with-cache
        uses: magnetikonline/action-node-modules-cache@v1
        with:
          node-version: 18.x
          node-modules-path: Www/node_modules
          package-lock-path: Www/package-lock.json

      - name: Install Node.js dependencies
        if: steps.node-with-cache.outputs.cache-hit != 'true'
        run: |
          cd Www
          npm ci

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          $env:Path += ";$env:USERPROFILE\.cargo\bin"
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Check wasm-pack version
        run: wasm-pack --version
       
      - name: Gulp build Tiefsee
        run: |
          cd Www
          gulp build

      - name: Setup MSBuild Path
        uses: microsoft/setup-msbuild@v1.1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.2.0

      - name: Restore NuGet Packages
        run: nuget restore Tiefsee4.sln

      - name: Build native host
        run: msbuild TiefseeNativeHost/TiefseeNativeHost.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64

      - name: Build Solution and archive artifacts
        run: msbuild Tiefsee4.sln /t:BuildAll /p:Configuration=Release /p:Platform="x64" /p:DeleteExistingFiles=True

      - name: Verify portable archive
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'Tiefsee.zip'))
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            foreach ($required in @('Tiefsee.exe', 'Tiefsee.dll', 'Tiefsee.runtimeconfig.json', 'Www/MainWindow.html', 'Www/js/MainWindow.js')) {
              if ($entries -notcontains $required) {
                throw "Missing $required in Tiefsee.zip"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tiefsee
          path: Tiefsee.zip
          if-no-files-found: error
